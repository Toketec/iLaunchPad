<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iLaunchPad 应用图标原型</title>
  <style>
    :root{font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#222;background:#f4f1eb}
    body{margin:0}.shell{max-width:900px;margin:auto;padding:32px}.card{border:1px solid #d8d0c6;border-radius:28px;background:rgba(255,255,255,.72);padding:28px}.icons{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:18px}.icon{aspect-ratio:1;border-radius:24%;display:grid;place-items:center;font-size:42px;background:var(--bg);color:var(--fg)}@media(max-width:700px){.icons{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main class="shell"><section class="card"><h1>应用图标</h1><p>玻璃蓝、玻璃紫、玻璃黑亮底、玻璃白暗底四款火箭；玻璃蓝为默认与回退。</p><div class="icons"><div class="icon" style="--bg:#dfefff;--fg:#0f49c8">↟</div><div class="icon" style="--bg:#f1efff;--fg:#6638ef">↟</div><div class="icon" style="--bg:#f6f5f2;--fg:#303744">↟</div><div class="icon" style="--bg:#111827;--fg:#f4f5f7">↟</div></div></section></main></body>
</html>
